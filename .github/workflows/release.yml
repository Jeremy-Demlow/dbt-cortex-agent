name: Publish Python package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to validate and build without publishing
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          fetch-depth: 0
      - name: Set up supported Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned build tooling and test surface
        run: >-
          python -m pip install --disable-pip-version-check
          'build==1.3.0'
          'twine==6.2.0'
          -e '.[test]'
      - name: Validate release tag, versions, changelog, and checkout
        run: >-
          python scripts/release_preflight.py
          --tag "${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}"
      - name: Run full test suite
        run: pytest -q
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel package-data inventory
        run: python tests/verify_wheel.py dist/*.whl
      - name: Upload verified distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'release' && github.event.action == 'published' && startsWith(github.event.release.tag_name, 'v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
