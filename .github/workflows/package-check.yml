name: dbt Cortex Agent package CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  policy-and-project-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package policy surface
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run policy, documentation, and CI contract tests
        run: pytest -q tests/test_docs.py tests/test_ci.py
      - name: Compile Python sources and tests
        run: python -m compileall -q src tests
      - name: Check patch hygiene
        run: git diff --check
      - name: Scan tracked files for secrets
        run: |
          python -m pip install --disable-pip-version-check 'detect-secrets==1.5.0'
          git ls-files -z -- ':!:*lock*' | (cd "$GITHUB_WORKSPACE" && xargs -0 detect-secrets scan) > "$RUNNER_TEMP/detect-secrets.json"
          python -c 'import json,os,pathlib,sys; p=json.loads(pathlib.Path(os.environ["RUNNER_TEMP"]).joinpath("detect-secrets.json").read_text()); sys.exit(bool(p.get("results")))'
      - name: Reject generated residue
        run: |
          rm -rf .pytest_cache
          find src tests -type d -name __pycache__ -prune -exec rm -rf {} +
          test -z "$(git status --porcelain)"

  python-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package test surface
        run: python -m pip install --disable-pip-version-check -e '.[test]'
      - name: Run full Python suite
        run: pytest -q

  dbt-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: lower-bound
            dbt-core: "~=1.10.0"
            dbt-snowflake: "1.10.3"
          - line: authority
            dbt-core: "~=1.11.0"
            dbt-snowflake: "1.11.4"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and ${{ matrix.line }} dbt line
        run: >-
          python -m pip install --disable-pip-version-check -e '.[test]'
          'dbt-core${{ matrix.dbt-core }}'
          'dbt-snowflake==${{ matrix.dbt-snowflake }}'
      - name: Show resolved dbt versions
        run: dbt --version
      - name: Resolve integration dependencies
        run: dbt deps --project-dir integration_tests --profiles-dir integration_tests
      - name: Parse integration consumer offline
        env:
          DBT_TARGET: sandbox
          SNOWFLAKE_ACCOUNT: offline
          SNOWFLAKE_USER: offline
          SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/nonexistent-package-ci-key.p8
          SNOWFLAKE_ROLE: offline
          SNOWFLAKE_WAREHOUSE: offline
          SNOWFLAKE_DATABASE: DBT_CORTEX_AGENT_SANDBOX
        run: dbt parse --project-dir integration_tests --profiles-dir integration_tests --no-partial-parse
      - name: Verify deterministic Agent, eval, and lifecycle contracts
        run: >-
          pytest -q
          tests/test_eval_plan_macros.py
          tests/test_materialization.py
          tests/test_eval.py
          tests/test_cli.py
          tests/test_manifest.py
      - name: Build wheel for installed end-to-end verification
        run: python -m build --wheel --outdir "$RUNNER_TEMP/wheel-dist"
      - name: Verify installed wheel with ${{ matrix.line }} dbt line
        run: >-
          python scripts/verify_installed_wheel.py
          --wheel "$RUNNER_TEMP"/wheel-dist/*.whl
          --dbt-package-dir .
          --dbt-core '${{ matrix.dbt-core }}'
          --dbt-snowflake '${{ matrix.dbt-snowflake }}'
      - name: Clean dbt residue
        if: always()
        run: rm -rf integration_tests/dbt_packages integration_tests/target integration_tests/logs build src/*.egg-info

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned release tooling
        run: >-
          python -m pip install --disable-pip-version-check
          'build==1.3.0'
          'twine==6.2.0'
          'pip-licenses==5.5.0'
          'cyclonedx-bom==7.1.0'
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Verify wheel package-data inventory
        run: python tests/verify_wheel.py dist/*.whl
      - name: Install wheel outside checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
      - name: Exercise installed CLI help, version, and preview fixture
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/wheel-smoke/bin/dbt-cortex-agent" --help
          test "$("$RUNNER_TEMP/wheel-smoke/bin/dbt-cortex-agent" --version)" = "0.0.1"
          mkdir preview-project
          printf "name: preview_project\nversion: 1.0.0\nconfig-version: 2\n" > preview-project/dbt_project.yml
          "$RUNNER_TEMP/wheel-smoke/bin/dbt-cortex-agent" init \
            --project-dir preview-project \
            --package-source https://example.invalid/dbt-cortex-agent.git \
            --target sandbox \
            --allow-database DBT_CORTEX_AGENT_SANDBOX \
            --json > preview.json
      - name: Generate dependency license inventory and SBOM
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          mkdir -p "$RUNNER_TEMP/supply-chain"
          python -m piplicenses --format=json --output-file="$RUNNER_TEMP/supply-chain/licenses.json"
          cyclonedx-py environment --output-format JSON --output-file "$RUNNER_TEMP/supply-chain/sbom.cdx.json"
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-evidence
          path: ${{ runner.temp }}/supply-chain
          if-no-files-found: error
      - name: Clean generated distribution residue
        if: always()
        run: rm -rf build dist src/*.egg-info
      - name: Reject generated residue
        run: test -z "$(git status --porcelain)"