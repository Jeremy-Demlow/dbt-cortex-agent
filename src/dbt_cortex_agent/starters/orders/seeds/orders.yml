version: 2

seeds:
  - name: orders
    description: Minimal order facts for the package starter.
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: order_date
        data_tests:
          - not_null
      - name: region
        data_tests:
          - not_null
      - name: revenue
        data_tests:
          - not_null