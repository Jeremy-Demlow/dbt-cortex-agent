[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-cortex-agent"
version = "0.3.0"
description = "dbt package and Python companion for Snowflake Cortex Agent lifecycle management"
readme = "README.md"
requires-python = ">=3.10,<4"
license = "Apache-2.0"
authors = [{ name = "Jeremy Demlow" }]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8", "tomli>=2; python_version < '3.11'"]
runtime = ["snowflake-connector-python>=3.18,<5"]

[project.scripts]
dbt-cortex-agent = "dbt_cortex_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]