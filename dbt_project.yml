name: 'dbt_cortex_agent'
version: '0.0.1'
config-version: 2

# Installable dbt package: model-backed Cortex Agent materialization, evaluation
# macros, and the generic eval-question-coverage test. Consumers define Agents
# as dbt models and evaluation datasets as models.
require-dbt-version: [">=1.10.0", "<2.0.0"]

macro-paths: ["macros"]

# Public var surface (documented in the extraction manifest). Defaults chosen so
# a consumer can start with zero config; override in the consuming project.
vars:
  cortex_agent_deploy_target: dbt_focus
  cortex_agent_allowed_targets: [dbt_focus]
  cortex_agent_allowed_databases: []
  cortex_agent_schema: AGENTS
  cortex_eval_schema: EVAL
  cortex_agent_skill_stage: SKILL_STAGE
  code_execution_enabled: false
  force_agent_recreate: false
  mcp_deploy_enabled: false
